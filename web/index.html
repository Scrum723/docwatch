<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DOC Watch: Alexa+ Simulation</title>
  <style>
    :root {
      --bg: #0e1116;
      --card: #171b22;
      --alexa: #00caff;
      --text: #f2f5f8;
      --muted: #9aa7b5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0b0d11;
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .phone {
      width: min(420px, 100%);
      background: linear-gradient(180deg, #1a2030, #10141c);
      border: 1px solid #2a3344;
      border-radius: 28px;
      padding: 1.25rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    .orb {
      width: 72px; height: 72px; border-radius: 50%;
      margin: 0.5rem auto 1rem;
      background: radial-gradient(circle at 30% 30%, #7ef, var(--alexa), #046);
      box-shadow: 0 0 30px rgba(0,202,255,0.45);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    h1 { text-align: center; font-size: 1.15rem; margin: 0 0 0.25rem; }
    .sub { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
    .badge {
      text-align: center;
      color: #ffb020;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
    }
    .chat {
      background: var(--card);
      border-radius: 16px;
      padding: 0.75rem;
      height: 360px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .msg {
      max-width: 92%;
      padding: 0.7rem 0.85rem;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 0.92rem;
      white-space: pre-wrap;
    }
    .user { align-self: flex-end; background: #243044; }
    .agent { align-self: flex-start; background: #102636; border: 1px solid #1d4a5c; }
    .composer { display: flex; gap: 0.5rem; margin-top: 0.85rem; }
    input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #2a3344;
      background: #0f131a;
      color: var(--text);
      padding: 0.75rem 1rem;
      font: inherit;
    }
    button {
      border: none;
      border-radius: 999px;
      background: var(--alexa);
      color: #032;
      font-weight: 700;
      padding: 0 1rem;
      cursor: pointer;
    }
    .voice-row {
      display: flex;
      gap: 0.5rem;
      margin: 0.75rem 0 0.25rem;
    }
    .voice-row button {
      flex: 1;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
    }
    #voiceBtn.listening {
      background: #ff6b6b;
      color: #fff;
      box-shadow: 0 0 18px rgba(255,107,107,0.55);
    }
    #voiceBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .voice-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      margin: 0.35rem 0 0.15rem;
      min-height: 1.1em;
    }
    .orb.listening {
      box-shadow: 0 0 40px rgba(255,107,107,0.65);
      animation-duration: 0.9s;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
    .chips button {
      background: #1c2433;
      color: var(--text);
      font-size: 0.75rem;
      padding: 0.45rem 0.7rem;
      font-weight: 600;
    }
    a { color: var(--alexa); font-size: 0.85rem; }
    .footer { text-align: center; margin-top: 0.85rem; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="orb" id="orb" aria-hidden="true"></div>
    <h1>Alexa+ · DOC Watch</h1>
    <div class="sub">Alexa+ Agent Skill sim · MCP tools · live NWS</div>
    <div class="badge">Voice-to-voice = Alexa+ · this page is the local sim</div>
    <div class="chat" id="chat"></div>
    <div class="chips">
      <button type="button" data-q="Alexa, coastal advisories for Rochester?">Coastal advisories</button>
      <button type="button" data-q="Any freeze or flood risk in the next twelve hours?">12h risk</button>
      <button type="button" data-q="Should I pull the boat?">Maritime advice</button>
      <button type="button" data-q="Give me a sixty-second briefing.">60s briefing</button>
      <button type="button" data-q="What's the forecast for Buffalo tonight?">Buffalo forecast</button>
      <button type="button" data-q="Show my Alexa+ sensors.">Alexa+ sensors</button>
      <button type="button" data-q="How does the flood sensor mesh work?">Features</button>
    </div>
    <div class="voice-row">
      <button type="button" id="voiceBtn" aria-pressed="false" title="Local stand-in for Alexa+ voice turn">🎙 Alexa+ voice (sim)</button>
      <button type="button" id="speakLastBtn" title="Speak the last DOC reply" style="background:#1c2433;color:var(--text)">🔊 Speak reply</button>
    </div>
    <label class="voice-hint" style="display:flex;flex-direction:column;align-items:stretch;gap:0.35rem;text-align:left">
      <span style="text-align:center">Alexa-like voice</span>
      <select id="voiceSelect" style="width:100%;background:#1c2433;color:var(--text);border:1px solid #2a3344;border-radius:10px;padding:0.45rem 0.6rem"></select>
    </label>
    <label class="voice-hint" style="display:flex;align-items:center;justify-content:center;gap:0.4rem;cursor:pointer">
      <input type="checkbox" id="speakToggle" checked />
      Speak replies (simulates Alexa+ voice out)
    </label>
    <div class="voice-hint" id="voiceHint">Product v2v is Alexa+. This mic is a local sim — tap once, speak, wait for the reply.</div>
    <form class="composer" id="form">
      <input id="input" placeholder="Ask DOC Watch…" autocomplete="off" />
      <button type="submit">Ask</button>
    </form>
    <div class="footer"><a href="/demo.html">Open tool playground</a></div>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const voiceBtn = document.getElementById("voiceBtn");
    const speakLastBtn = document.getElementById("speakLastBtn");
    const speakToggle = document.getElementById("speakToggle");
    const voiceSelect = document.getElementById("voiceSelect");
    const voiceHint = document.getElementById("voiceHint");
    const orb = document.getElementById("orb");

    function add(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    let lastLocation = "rochester";
    let voiceBusy = false;
    let isListening = false;
    let lastAgentReply = "";
    let preferredVoiceURI = localStorage.getItem("docwatch_voice_uri") || "";

    add("agent", "Hi. I'm DOC Watch for Alexa+. Real voice-to-voice runs through Alexa-plus calling these MCP tools. This page simulates that loop locally. Ask about coastal advisories in Rochester, Buffalo, Fairport, or Sodus Point. Alexa+ sensors are on.");
    lastAgentReply = chat.querySelector(".agent") ? chat.querySelector(".agent").textContent : "";

    function pickLocation(s) {
      if (/\bbuffalo\b|\bbflo\b|\blake erie\b/.test(s)) return "buffalo";
      if (/\bfairport\b/.test(s)) return "fairport";
      if (/\bsodus\b/.test(s)) return "sodus";
      if (/\blong pond\b|\bgreece\b/.test(s)) return "long_pond";
      if (/\brochester\b|\bnorth greece\b|\broc\b/.test(s)) return "rochester";
      return lastLocation;
    }

    function pickAsset(s) {
      if (/\bmaritime\b|\bboat\b|\bdock\b|\bcraft\b/.test(s)) return "maritime";
      if (/\bmobile\b|\bvan\b|\bvehicle\b|\bcar\b/.test(s)) return "mobile";
      if (/\bcurrent location\b|\bhere\b|\bmy location\b/.test(s)) return "current_location";
      if (/\bhome\b|\bhouse\b/.test(s)) return "home";
      return "maritime";
    }

    function route(q) {
      const s = q.toLowerCase();
      const location = pickLocation(s);
      lastLocation = location;
      if (s.includes("sensor") || s.includes("alexa+") || s.includes("humidity") || s.includes("motion")) {
        return ["get_home_sensors", { location }];
      }
      if (s.includes("brief") || s.includes("sixty") || s.includes("60") || s.includes("spoken")) {
        return ["get_spoken_briefing", { location, seconds: 60 }];
      }
      if (s.includes("feature") || s.includes("mesh") || s.includes("flood sensor") || s.includes("join") || s.includes("how does")) {
        return ["describe_features", { topic: s.includes("flood") ? "flood_sensor" : "all" }];
      }
      if (s.includes("watch") && (s.includes("alert") || s.includes("threshold") || s.includes("set"))) {
        return ["set_watch", { location, windMph: 25, freezeTempF: 36, flood: true }];
      }
      if (s.includes("pull") || s.includes("cover") || s.includes("boat") || s.includes("van") || s.includes("advice") || s.includes("should i") || s.includes("coastal") || s.includes("maritime")) {
        return ["get_DOC_advice", { location, asset: pickAsset(s) }];
      }
      if (s.includes("risk") || s.includes("freeze") || s.includes("flood") || s.includes("twelve") || s.includes("12h") || /\b12\b/.test(s)) {
        return ["get_DOC_advice", { location, asset: pickAsset(s) }];
      }
      if (s.includes("alert")) {
        return ["get_alerts", { location }];
      }
      if (s.includes("forecast") || s.includes("tonight") || s.includes("tomorrow") || s.includes("hourly")) {
        return ["get_forecast", { location, hours: 24 }];
      }
      return ["get_current_conditions", { location }];
    }

    function scoreVoice(v) {
      const n = v.name || "";
      const lang = v.lang || "";
      if (!/^en(-|_)/i.test(lang)) return -1000;
      let score = 10;
      // Prefer neural / natural female voices (Alexa-like).
      if (/aria|jenny|michelle|natasha|samantha|zira|susan|hazel|eva|sonia/i.test(n)) score += 80;
      if (/natural|neural|online/i.test(n)) score += 60;
      if (/google us english/i.test(n)) score += 50;
      if (/female/i.test(n)) score += 30;
      if (/microsoft/i.test(n)) score += 15;
      // Avoid classic robotic desktop / male defaults.
      if (/david|mark|george|ravi|desktop|espeak|microsoft david/i.test(n)) score -= 80;
      if (/male/i.test(n) && !/female/i.test(n)) score -= 20;
      return score;
    }

    function listEnVoices() {
      if (!window.speechSynthesis) return [];
      return window.speechSynthesis.getVoices()
        .filter((v) => /^en(-|_)/i.test(v.lang || ""))
        .slice()
        .sort((a, b) => scoreVoice(b) - scoreVoice(a));
    }

    function selectedVoice() {
      const voices = listEnVoices();
      if (!voices.length) return null;
      if (preferredVoiceURI) {
        const match = voices.find((v) => v.voiceURI === preferredVoiceURI);
        // Ignore cached robotic voices from older sessions.
        if (match && scoreVoice(match) >= 40) return match;
      }
      return voices[0];
    }

    function fillVoiceSelect() {
      if (!voiceSelect) return;
      const voices = listEnVoices();
      const prev = preferredVoiceURI || (voices[0] && voices[0].voiceURI) || "";
      voiceSelect.innerHTML = "";
      if (!voices.length) {
        const opt = document.createElement("option");
        opt.textContent = "No English voices found yet — reload page";
        voiceSelect.appendChild(opt);
        return;
      }
      for (const v of voices) {
        const opt = document.createElement("option");
        opt.value = v.voiceURI;
        opt.textContent = v.name + " (" + v.lang + ")" + (scoreVoice(v) >= 50 ? " ★" : "");
        voiceSelect.appendChild(opt);
      }
      if (prev && [...voiceSelect.options].some((o) => o.value === prev)) {
        voiceSelect.value = prev;
        preferredVoiceURI = prev;
      } else {
        preferredVoiceURI = voices[0].voiceURI;
        voiceSelect.value = preferredVoiceURI;
        localStorage.setItem("docwatch_voice_uri", preferredVoiceURI);
      }
    }

    function speak(text) {
      return new Promise((resolve) => {
        if (!window.speechSynthesis) {
          resolve();
          return;
        }
        window.speechSynthesis.cancel();
        const clean = String(text || "")
          .replace(/https?:\/\/\S+/gi, "")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 1400);
        if (!clean) {
          resolve();
          return;
        }
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = "en-US";
        // Alexa-like pacing: calm, slightly warm.
        u.rate = 0.96;
        u.pitch = 1.05;
        u.volume = 1;
        const voice = selectedVoice();
        if (voice) {
          u.voice = voice;
          u.lang = voice.lang || "en-US";
        }
        let settled = false;
        const done = () => {
          if (settled) return;
          settled = true;
          clearInterval(keepAlive);
          resolve();
        };
        u.onend = done;
        u.onerror = done;
        // Chrome bug: synthesis can freeze unless periodically resumed.
        const keepAlive = setInterval(() => {
          try {
            if (window.speechSynthesis.speaking) window.speechSynthesis.resume();
          } catch (_) {}
        }, 4000);
        setTimeout(() => {
          try {
            window.speechSynthesis.speak(u);
            window.speechSynthesis.resume();
          } catch (_) {
            done();
          }
        }, 120);
      });
    }

    function shouldSpeak(opts) {
      if (opts && opts.speak === true) return true;
      if (opts && opts.speak === false) return false;
      return !!(speakToggle && speakToggle.checked);
    }

    async function ask(q, opts) {
      const speakReply = shouldSpeak(opts);
      add("user", q);
      const [tool, body] = route(q);
      // Silent wait bubble — do not speak the filler (that sounded robotic).
      add("agent", "One moment…");
      try {
        const res = await fetch("/api/tools/" + tool, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        const human = (data.structuredContent && data.structuredContent.human) || data.human || JSON.stringify(data);
        chat.removeChild(chat.lastChild);
        add("agent", human);
        lastAgentReply = human;
        if (speakReply) await speak(human);
        return human;
      } catch (e) {
        const err = "Something went wrong: " + (e.message || e);
        chat.removeChild(chat.lastChild);
        add("agent", err);
        lastAgentReply = err;
        if (speakReply) await speak(err);
        return err;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function setListening(on) {
      isListening = on;
      voiceBtn.classList.toggle("listening", on);
      orb.classList.toggle("listening", on);
      voiceBtn.setAttribute("aria-pressed", on ? "true" : "false");
      voiceBtn.textContent = on ? "● Listening… tap to stop" : "🎙 Alexa+ voice (sim)";
    }

    function sttErrorMessage(code) {
      if (code === "not-allowed") {
        return "Microphone blocked. Allow mic for 127.0.0.1, then reload.";
      }
      if (code === "network") {
        return "Browser mic STT is offline (cloud). Product v2v is Alexa+. Use chips + Speak replies, or Speak reply.";
      }
      if (code === "no-speech") {
        return "No speech heard. Tap Alexa+ voice once, then speak.";
      }
      if (code === "audio-capture") {
        return "No microphone found. Check Windows sound settings.";
      }
      if (code === "aborted") return "Listening stopped.";
      return "Mic sim error: " + (code || "unknown") + ". Use chips + Speak replies (Alexa+ is the real v2v path).";
    }

    function makeRecognizer() {
      if (!SpeechRecognition) return null;
      const rec = new SpeechRecognition();
      rec.lang = "en-US";
      rec.interimResults = false; // prevents UI thrash / "spaz"
      rec.maxAlternatives = 1;
      rec.continuous = false;
      return rec;
    }

    function stopListening(rec) {
      try { if (rec) rec.onresult = null; } catch (_) {}
      try { if (rec) rec.onerror = null; } catch (_) {}
      try { if (rec) rec.onend = null; } catch (_) {}
      try { if (rec) rec.abort(); } catch (_) {}
      setListening(false);
    }

    if (!SpeechRecognition) {
      voiceBtn.disabled = true;
      voiceHint.textContent = "Mic STT needs Chrome or Edge. Use chips/type with Speak replies ON.";
    } else {
      voiceBtn.addEventListener("click", () => {
        if (voiceBusy) return;

        // Toggle off if already listening — no retry loops.
        if (isListening) {
          setListening(false);
          voiceHint.textContent = "Listening stopped. Tap again when ready, or use chips.";
          return;
        }

        if (window.speechSynthesis) window.speechSynthesis.cancel();

        const rec = makeRecognizer();
        if (!rec) return;

        let handled = false;

        rec.onstart = () => {
          setListening(true);
          voiceHint.textContent = "Listening… ask your question, then pause.";
        };

        rec.onerror = (ev) => {
          const code = ev.error || "unknown";
          if (code === "aborted") return;
          handled = true;
          setListening(false);
          voiceBusy = false;
          voiceBtn.disabled = false;
          voiceHint.textContent = sttErrorMessage(code);
          if (code === "network" || code === "not-allowed") {
            speakToggle.checked = true;
            input.focus();
          }
        };

        rec.onend = () => {
          // Only clear listening UI if we did not already hand off to ask().
          if (!voiceBusy) setListening(false);
        };

        rec.onresult = async (ev) => {
          if (handled) return;
          handled = true;
          const transcript = (ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript || "").trim();
          setListening(false);
          if (!transcript) {
            voiceHint.textContent = "Did not catch that. Tap Alexa+ voice once and try again.";
            return;
          }
          voiceBusy = true;
          voiceBtn.disabled = true;
          input.value = transcript;
          voiceHint.textContent = "Got it. Checking NWS, then speaking…";
          try {
            await ask(transcript, { speak: true });
            voiceHint.textContent = "Done. Tap Alexa+ voice for another turn.";
          } finally {
            voiceBusy = false;
            voiceBtn.disabled = false;
            setListening(false);
          }
        };

        try {
          rec.start();
        } catch (err) {
          setListening(false);
          voiceHint.textContent = "Could not start mic. Reload the page, then tap once.";
        }
      });
    }

    if (window.speechSynthesis) {
      fillVoiceSelect();
      window.speechSynthesis.onvoiceschanged = () => fillVoiceSelect();
    }
    if (voiceSelect) {
      voiceSelect.addEventListener("change", () => {
        preferredVoiceURI = voiceSelect.value;
        localStorage.setItem("docwatch_voice_uri", preferredVoiceURI);
        const v = selectedVoice();
        voiceHint.textContent = v ? ("Voice set to " + v.name) : "Voice updated.";
        // Preview so you can hear the Alexa-like pick immediately.
        speak("Coastal advisories ready for Rochester.");
      });
    }

    speakLastBtn.addEventListener("click", async () => {
      if (!lastAgentReply) {
        voiceHint.textContent = "No reply to speak yet. Ask a question first.";
        return;
      }
      voiceHint.textContent = "Speaking last DOC reply…";
      await speak(lastAgentReply);
      voiceHint.textContent = "Done.";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = "";
      ask(q);
    });

    document.querySelectorAll(".chips button").forEach((btn) => {
      btn.addEventListener("click", () => ask(btn.getAttribute("data-q")));
    });
  </script>
</body>
</html>
